# This file handles automatic deployment of both Frontend and Backend
name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # --- FRONTEND BUILD ---
      - name: Install Frontend Deps
        run: npm ci

      - name: Build Frontend
        run: npm run build

      # --- BACKEND BUILD ---
      - name: Install Functions Deps
        run: |
          cd functions
          npm ci

      # --- DEPLOYMENT ---
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FGC_MATCHMAKING_DEMO }}
          channelId: live
          projectId: fgc-matchmaking-demo
        # This action natively deploys hosting, but we can tell it to include functions

      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --non-interactive
        env:
          # We use the service account already stored in your GitHub Secrets
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.deploy_hosting.outputs.details_url }}
        # Note: If the step above doesn't share credentials,
        # the most reliable way is using the Firebase CLI directly:

      - name: Firebase CLI Deploy Functions
        run: |
          sudo npm install -g firebase-tools
          firebase deploy --only functions --token ${{ secrets.FIREBASE_TOKEN }} || true